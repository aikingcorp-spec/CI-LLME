appId: com.rakazo.app
name: Auth
---
- runFlow: ../subflows/launch-app.yaml
- extendedWaitUntil:
    visible: "Sign in to VNBot"
    timeout: 15000
- takeScreenshot: 02-sign-in
- tapOn: "Email"
- inputText: ${RAKAZO_SCREENSHOT_EMAIL}
- hideKeyboard
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Check your email"
    timeout: 20000
- takeScreenshot: 03-check-email
- tapOn: "Use a custom server|Custom server"
- extendedWaitUntil:
    visible: "Server"
    timeout: 10000
- takeScreenshot: 04-custom-server
- tapOn:
    text: "http.*|https.*"
    optional: true
- eraseText: 80
- inputText: "::::"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "That doesn.*look like a URL|Could not reach that server|That URL did not look like a VNBot server|Enter a server URL"
    timeout: 15000
- takeScreenshot: 05-server-error
- tapOn: "Cancel"
