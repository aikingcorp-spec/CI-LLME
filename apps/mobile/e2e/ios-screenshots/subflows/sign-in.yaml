appId: com.rakazo.app
---
- runFlow: launch-app.yaml
- extendedWaitUntil:
    visible: "Sign in to VNBot"
    timeout: 15000
- tapOn: "Email"
- inputText: ${RAKAZO_ACTIVE_EMAIL}
- hideKeyboard
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Check your email"
    timeout: 15000
- runScript: read-sign-in-code.js
- tapOn: "Code"
- inputText: ${output.signInCode}
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    text: "Don’t allow"
    optional: true
- tapOn:
    text: "Don't allow"
    optional: true
- extendedWaitUntil:
    visible: "Account"
    timeout: 40000
