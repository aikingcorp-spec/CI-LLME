<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; form-action 'none'; base-uri 'none'"
    />
    <title>Thiết lập VNBot</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <header class="titlebar">
      <span class="titlebar-name">VNBot</span>
      <button id="quit" class="titlebar-quit" type="button" title="Thoát VNBot" data-text="quit" data-title="quitTitle">Thoát</button>
    </header>

    <main class="shell">
      <h1 class="heading" data-text="heading">Chào mừng đến với VNBot</h1>
      <p class="subheading" data-text="subheading">Chọn máy chủ mà ứng dụng này sẽ sử dụng.</p>

      <form id="setup" novalidate>
        <fieldset class="choices">
          <legend class="sr-only" data-text="legend">Máy chủ</legend>

          <label class="choice" for="mode-new">
            <input id="mode-new" type="radio" name="mode" value="new" checked />
            <span class="choice-title" data-text="modeNew">Máy tính này</span>
          </label>

          <label class="choice" for="mode-cloud">
            <input id="mode-cloud" type="radio" name="mode" value="cloud" />
            <span class="choice-title" data-text="modeCloud">VNBot Cloud</span>
          </label>

          <label class="choice" for="mode-existing">
            <input id="mode-existing" type="radio" name="mode" value="existing" />
            <span class="choice-title" data-text="modeExisting">Máy chủ có sẵn</span>
          </label>
        </fieldset>

        <section id="panel-new" class="panel">
          <div id="stack" hidden>
            <div class="stack-head">
              <p id="stack-phase" class="stack-phase" role="status" aria-live="polite"></p>
              <button
                id="stack-details"
                class="icon-button"
                type="button"
                aria-controls="stack-output"
                aria-expanded="false"
                aria-label="Chi tiết kỹ thuật"
                title="Chi tiết kỹ thuật"
                data-aria-label="technicalDetails"
                data-title="technicalDetails"
              >
                <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <path d="M3.5 4.5 7 8l-3.5 3.5M8.5 11.5H13" />
                </svg>
              </button>
            </div>
            <div
              id="stack-progress"
              class="progress"
              role="progressbar"
              aria-label="Tiến trình thiết lập"
              data-aria-label="progress"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              hidden
            >
              <div id="stack-progress-fill" class="progress-fill"></div>
            </div>
            <p id="stack-detail" class="stack-detail"></p>
            <pre id="stack-output" class="stack-output" hidden></pre>
            <div id="stack-docker-help" class="stack-help" hidden>
              <button class="link" type="button" data-link="docker-desktop">Docker Desktop</button>
              <button class="link" type="button" data-link="orbstack">OrbStack</button>
              <button class="link" type="button" data-link="docker-engine">Docker Engine</button>
            </div>
          </div>
        </section>

        <section id="panel-existing" class="panel" hidden>
          <label class="field-label" for="server-url" data-text="serverAddress">Địa chỉ máy chủ</label>
          <input
            id="server-url"
            class="field"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="https://vnbot.example.com"
            data-placeholder="serverPlaceholder"
          />
        </section>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <div class="actions">
          <button id="check" class="button button-secondary" type="button" data-text="check">Kiểm tra kết nối</button>
          <button id="continue" class="button button-primary" type="submit" data-text="continue">Tiếp tục</button>
        </div>
      </form>
    </main>

    <script src="setup.js"></script>
  </body>
</html>
