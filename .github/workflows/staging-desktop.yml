name: staging-desktop

# Customer-trial installers only. Push to staging/** or a manual dispatch.
# No pull_request trigger, so a branch push does not run this twice.
# Runner labels are the standard GitHub-hosted set checked on 2026-11-14:
# https://docs.github.com/en/actions/reference/runners/github-hosted-runners
# ubuntu-24.04 and windows-2025 are x64. macos-26-intel is Intel. macos-26 is arm64.
# Desktop package targets are x64 on Linux and Windows, so arm runners are not added.

# A branch named staging/vnbot-040-production* builds the production channel: pinned to the
# production portal (vars RAKAZO_*_PRODUCTION) and keeping the update feed in package.json.
on:
  push:
    branches:
      - "staging/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      STAGING_RUNNER: ${{ matrix.os }}
      VNBOT_CHANNEL: ${{ startsWith(github.ref_name, 'staging/vnbot-040-production') && 'production' || 'staging' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: windows-2025
            artifact: windows-x64
          - os: macos-26
            artifact: macos-universal
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The universal app runs migrations on Intel and Apple silicon, so Prisma must download both
      # schema engines during install; by default it fetches only the runner architecture.
      - name: Fetch Prisma engines for both Mac architectures
        if: runner.os == 'macOS'
        shell: bash
        run: echo "PRISMA_CLI_BINARY_TARGETS=darwin,darwin-arm64" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-workspace
        with:
          electron: "true"

      - name: Check the staging desktop plan
        shell: bash
        run: node --test .github/scripts/staging-desktop-verify.test.mjs

      - name: Require the public staging pin
        shell: bash
        env:
          RAKAZO_IDENTITY_PIN: ${{ startsWith(github.ref_name, 'staging/vnbot-040-production') && vars.RAKAZO_IDENTITY_PIN_PRODUCTION || vars.RAKAZO_IDENTITY_PIN }}
          RAKAZO_CLOUD_URL: ${{ startsWith(github.ref_name, 'staging/vnbot-040-production') && vars.RAKAZO_CLOUD_URL_PRODUCTION || vars.RAKAZO_CLOUD_URL }}
        run: node .github/scripts/staging-desktop-verify.mjs require-public --channel "$VNBOT_CHANNEL"

      - name: Generate the database client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo

      # The desktop unit suite assumes POSIX temp paths; the packaged smoke below is the cross-OS check.
      - name: Desktop unit tests
        if: runner.os == 'Linux'
        run: pnpm --filter @rakazo/desktop test

      - name: Install PostgreSQL 18 and 16
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-18

      # The relocatable @embedded-postgres builds (macOS, Windows; 16 on Linux): 16.14.0-beta.17 is the
      # server 0.3.9 shipped, so its data directory upgrades with the same binaries.
      - name: Fetch embedded PostgreSQL 18 and 16
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.artifact }}" in
            # The darwin-arm64 package ships fat x86_64 + arm64 binaries; build-native checks that.
            macos-universal) package=@embedded-postgres/darwin-arm64 ;;
            windows-x64) package=@embedded-postgres/windows-x64 ;;
            # Linux keeps PostgreSQL 18 from Debian; only the 0.3.9 server comes from the package.
            linux-x64) package=@embedded-postgres/linux-x64 ;;
          esac
          [ "${{ runner.os }}" = Linux ] || node .github/scripts/staging-desktop-verify.mjs fetch-embedded --package "$package" --version 18.4.0-beta.17 --dest "$RUNNER_TEMP/ep18" > "$RUNNER_TEMP/ep18.path"
          node .github/scripts/staging-desktop-verify.mjs fetch-embedded --package "$package" --version 16.14.0-beta.17 --dest "$RUNNER_TEMP/ep16" > "$RUNNER_TEMP/ep16.path"

      # The universal app runs this node on both chips, so join the official x64 and arm64 builds.
      - name: Join a universal Node
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p process.version)"
          dir="$RUNNER_TEMP/node-universal"
          mkdir -p "$dir"
          for arch in x64 arm64; do
            curl -fsSL "https://nodejs.org/dist/$version/node-$version-darwin-$arch.tar.gz" | tar xz -C "$dir"
          done
          lipo -create -output "$dir/node" \
            "$dir/node-$version-darwin-x64/bin/node" "$dir/node-$version-darwin-arm64/bin/node"
          lipo "$dir/node" -verify_arch x86_64 arm64
          echo "NATIVE_NODE=$dir/node" >> "$GITHUB_ENV"
          echo "NATIVE_ARCH=universal" >> "$GITHUB_ENV"

      - name: Build API, worker, web, and desktop
        shell: bash
        run: |
          set -euo pipefail
          # The desktop app installs the server with its dependencies bundled: a few hundred files
          # instead of every package, which antivirus scans one by one on install.
          VNBOT_INLINE_DEPS=1 pnpm --filter @rakazo/api build
          VNBOT_INLINE_DEPS=1 pnpm --filter @rakazo/worker build
          pnpm --filter @rakazo/web build
          pnpm --filter @rakazo/desktop build
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
          BETTER_AUTH_SECRET: ci-build-auth-secret-at-least-32-characters
          ENCRYPTION_KEY: ci-build-encryption-key-at-least-32-characters
          RAKAZO_IDENTITY_PIN: ${{ startsWith(github.ref_name, 'staging/vnbot-040-production') && vars.RAKAZO_IDENTITY_PIN_PRODUCTION || vars.RAKAZO_IDENTITY_PIN }}
          RAKAZO_CLOUD_URL: ${{ startsWith(github.ref_name, 'staging/vnbot-040-production') && vars.RAKAZO_CLOUD_URL_PRODUCTION || vars.RAKAZO_CLOUD_URL }}

      - name: Assemble the native bundle
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              current_root=/usr
              legacy_root="$(cat "$RUNNER_TEMP/ep16.path")"
              ;;
            macOS|Windows)
              current_root="$(cat "$RUNNER_TEMP/ep18.path")"
              legacy_root="$(cat "$RUNNER_TEMP/ep16.path")"
              ;;
            *)
              echo "Unsupported runner OS ${{ runner.os }}" >&2
              exit 1
              ;;
          esac
          current="$(node .github/scripts/staging-desktop-verify.mjs prepare-current --root "$current_root" --major 18 --dest "$RUNNER_TEMP/pg18")"
          legacy="$(node .github/scripts/staging-desktop-verify.mjs prepare-legacy --root "$legacy_root" --major 16 --dest "$RUNNER_TEMP/pg16")"
          pnpm --filter @rakazo/desktop run build:native \
            --node "${NATIVE_NODE:-$(node -p process.execPath)}" \
            --arch "${NATIVE_ARCH:-$(node -p process.arch)}" \
            --postgres "$current" \
            --legacy-postgres "$legacy"

      - name: Package unsigned installers
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          args=()
          while IFS= read -r line; do
            if [[ -n "$line" ]]; then
              args+=("$line")
            fi
          done < <(node .github/scripts/staging-desktop-verify.mjs plan --runner "$STAGING_RUNNER" --channel "$VNBOT_CHANNEL")
          pnpm --filter @rakazo/desktop exec electron-builder "${args[@]}"

      - name: Check installers and write checksums
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/staging-desktop-verify.mjs artifacts \
            --runner "$STAGING_RUNNER" \
            --channel "$VNBOT_CHANNEL" \
            --out apps/desktop/out \
            --checksums apps/desktop/out/SHA256SUMS

      # Uploaded before the smoke so a tester can try every built installer; the smoke result
      # below says which ones started on a clean runner.
      - name: Upload installers and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-desktop-${{ matrix.artifact }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            apps/desktop/out/*.AppImage
            apps/desktop/out/*.deb
            apps/desktop/out/*.dmg
            apps/desktop/out/*.exe
            apps/desktop/out/*.msi
            apps/desktop/out/*.zip
            apps/desktop/out/*.blockmap
            apps/desktop/out/latest*.yml
            apps/desktop/out/SHA256SUMS

      - name: Smoke the packaged app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging-smoke
          node .github/scripts/staging-desktop-verify.mjs smoke \
            --runner "$STAGING_RUNNER" \
            --out apps/desktop/out \
            --profile "$RUNNER_TEMP/vnbot-desktop-smoke" \
            --log staging-smoke/smoke.log

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-desktop-smoke-${{ matrix.artifact }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: staging-smoke/

  # The Intel runner smokes the universal download the Apple silicon job built.
  smoke-macos-intel:
    name: Smoke macos-universal on Intel
    needs: package
    if: ${{ !cancelled() }}
    runs-on: macos-26-intel
    timeout-minutes: 30
    env:
      STAGING_RUNNER: macos-26-intel
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: staging-desktop-macos-universal-${{ github.sha }}
          path: apps/desktop/out
      - name: Smoke the packaged app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging-smoke
          node .github/scripts/staging-desktop-verify.mjs smoke \
            --runner "$STAGING_RUNNER" \
            --out apps/desktop/out \
            --profile "$RUNNER_TEMP/vnbot-desktop-smoke" \
            --log staging-smoke/smoke.log
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-desktop-smoke-macos-universal-intel-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: staging-smoke/
