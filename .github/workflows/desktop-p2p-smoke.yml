name: desktop-p2p-smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-account:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Scoped type checks
        run: pnpm --filter @rakazo/p2p-prototype check && pnpm --filter @rakazo/desktop check && pnpm --filter @rakazo/web check && pnpm --filter @rakazo/p2p-gateway check
      - name: Account proxy and gateway regression tests
        run: pnpm exec vitest run apps/desktop/src apps/p2p-gateway/src apps/web/src/lib/p2p-client.test.ts apps/web/src/lib/p2p-locales.test.ts apps/web/src/pages/Auth.test.tsx apps/web/src/pages/Pairing.test.tsx packages/p2p-prototype/src packages/contracts/src/content-security-policy.test.ts apps/web/src/pages/shell/computer-overlay.test.tsx apps/web/src/lib/computer-screen.test.ts --maxWorkers=4
      - name: Check changed TypeScript
        run: pnpm exec biome check apps/desktop/p2p/agent-process.ts apps/p2p-gateway/src/hosted-app.test.ts apps/p2p-gateway/src/hosted-app.ts apps/web/e2e/p2p-pairing.spec.ts apps/web/e2e/p2p-screen-fixture.tsx apps/web/src/components/ComputerScreenFrame.tsx apps/web/src/lib/novnc.d.ts apps/web/src/lib/p2p-client.ts apps/web/src/lib/p2p-screen-entry.ts apps/web/src/pages/shell/computer-overlay.tsx apps/web/src/pages/shell/computer-panel.tsx apps/web/src/pages/shell/use-computer.tsx apps/web/vite.config.ts packages/contracts/src/content-security-policy.test.ts packages/contracts/src/content-security-policy.ts packages/p2p-prototype/src/browser.ts packages/p2p-prototype/src/channel-protocol.test.ts packages/p2p-prototype/src/channel-protocol.ts packages/p2p-prototype/src/client-transport.test.ts packages/p2p-prototype/src/data-channel-client.ts packages/p2p-prototype/src/node-channel-server.ts packages/p2p-prototype/src/rfb-fixture.ts packages/p2p-prototype/src/screen-connector.test.ts packages/p2p-prototype/src/screen-connector.ts packages/p2p-prototype/src/screen-path.test.ts packages/p2p-prototype/src/screen-path.ts packages/p2p-prototype/src/socket-session.test.ts packages/p2p-prototype/src/socket-session.ts
      - name: Install Chromium for P2P browser regression
        if: runner.os == 'Linux'
        run: pnpm --filter @rakazo/web exec playwright install --with-deps chromium
      - name: Browser P2P large-frame and reconnect regression
        if: runner.os == 'Linux'
        run: pnpm --filter @rakazo/web exec playwright test e2e/p2p-pairing.spec.ts --grep 'Vietnamese pairing at 360px' --workers=1
      - name: Upload browser regression evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: p2p-browser-regression
          path: |
            apps/web/test-results
            blob-report
          retention-days: 7
      - name: Build isolated desktop agent
        run: node apps/desktop/scripts/build-p2p-agent.mjs
      - name: Build real web application
        env:
          VITE_P2P_GATEWAY_URL: https://p2p.vnbot.run
        run: pnpm --filter @rakazo/web build
      - name: App Worker dry run
        working-directory: apps/p2p-gateway
        run: pnpm exec wrangler deploy --config ../../deploy/cloudflare/app/wrangler.toml --dry-run --outdir ../../.out/app-worker --var AUTH_ORIGIN:https://accounts.example.test --var P2P_GATEWAY_URL:https://p2p.vnbot.run
      - uses: actions/upload-artifact@v4
        with:
          name: p2p-renewal-build-${{ matrix.os }}
          path: |
            .out/app-worker
            apps/web/dist
            apps/desktop/dist/p2p-agent.js
          retention-days: 7
