name: desktop-p2p-smoke

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/p2p-prototype/**"
      - ".github/workflows/desktop-p2p-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-p2p-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p2p-smoke:
    name: Gateway, node agent and client over a loopback data channel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run gateway, node agent and client on localhost
        # No staging gateway and no TURN secret: a fake auth endpoint stands in for sign-in,
        # and host candidates are enough on one machine.
        working-directory: packages/p2p-prototype
        env:
          AUTH_BASE_URL: http://127.0.0.1:3100
          GATEWAY_URL: http://127.0.0.1:8787
          SESSION_TOKEN: test-token
          NODE_ID: ci-node
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/p2p-smoke"
          mkdir -p "$work"
          cat > "$work/fake-auth.mjs" <<'SCRIPT'
          import { createServer } from "node:http";
          createServer((req, res) => {
            const ok = req.method === "GET" && req.url === "/api/auth/get-session";
            res.writeHead(ok ? 200 : 404, { "content-type": "application/json" });
            res.end(ok ? JSON.stringify({
              session: { expiresAt: new Date(Date.now() + 3_600_000).toISOString() },
              user: { id: "ci-user", email: "ci@example.test", emailVerified: true },
            }) : "null");
          }).listen(3100, "127.0.0.1");
          SCRIPT
          pids=()
          cleanup() { for pid in "${pids[@]}"; do kill "$pid" 2>/dev/null || true; done; }
          trap cleanup EXIT

          node "$work/fake-auth.mjs" > "$work/fake-auth.log" 2>&1 &
          pids+=($!)
          PORT=8787 pnpm exec tsx src/bin/gateway.ts > "$work/gateway.log" 2>&1 &
          pids+=($!)
          # Any HTTP answer (even 401) means the gateway is listening.
          for _ in $(seq 1 60); do
            curl -s -o /dev/null -X POST "$GATEWAY_URL/pair/start" && break
            sleep 1
          done

          echo "== two-process data channel echo (webrtc-demo)"
          timeout 90 pnpm exec tsx src/bin/webrtc-demo.ts

          echo "== node agent plus client transport (transport-demo)"
          code="$(curl -s -X POST -H "Authorization: Bearer $SESSION_TOKEN" "$GATEWAY_URL/pair/start" \
            | node -e 'process.stdin.on("data", (d) => console.log(JSON.parse(d).code))')"
          NODE_KEY_FILE="$work/node-key.json" PAIR_CODE="$code" \
            pnpm exec tsx src/bin/node-agent.ts > "$work/node-agent.log" 2>&1 &
          pids+=($!)
          for _ in $(seq 1 60); do
            grep -q "dialing" "$work/node-agent.log" && break
            sleep 1
          done
          timeout 60 pnpm exec tsx src/bin/transport-demo.ts | tee "$work/transport.log"
          grep -q "data-channel call status=200" "$work/transport.log"
      - name: Show logs on failure
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP"/p2p-smoke/*.log || true
