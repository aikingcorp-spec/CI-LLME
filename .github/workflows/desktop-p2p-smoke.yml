name: legacy-in-app-upgrade-acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-upgrade:
    if: github.repository == 'aikingcorp-spec/CI-LLME'
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install acceptance driver
        run: npm install --prefix .ci/probe-tools --no-audit --no-fund @playwright/test@1.64.1
      - name: Fetch and verify public installer
        run: |
          Invoke-WebRequest -Uri 'https://dl.vnbot.run/desktop/VNBot-Setup-0.3.7-x64.exe' -UserAgent 'electron-updater' -OutFile installer.exe
          $hash = (Get-FileHash installer.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '1670dc906f10f8e3c5848f01f9f61659fb784336d3627a631cfcbf1a16eb9786') { throw 'Public installer digest mismatch' }
      - name: Upgrade through the actual in-app installer
        run: |
          Start-Process -FilePath "$env:GITHUB_WORKSPACE\installer.exe" -ArgumentList '/S' -Wait
          $env:PROBE_INSTALLED_APP = Join-Path $env:LOCALAPPDATA 'Programs\VNBot\VNBot.exe'
          node .ci/legacy-upgrade-probe.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Legacy in-app installer failed' }
          $deadline = (Get-Date).AddSeconds(120)
          do {
            Start-Sleep -Seconds 2
            $version = (Get-Item $env:PROBE_INSTALLED_APP).VersionInfo.ProductVersion
          } while ($version -notmatch '^0\.3\.8' -and (Get-Date) -lt $deadline)
          if ($version -notmatch '^0\.3\.8') { throw 'Real installer did not update the executable' }
          node .ci/legacy-upgrade-verify.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Upgraded app verification failed' }
