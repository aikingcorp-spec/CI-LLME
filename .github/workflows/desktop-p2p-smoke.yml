name: desktop-p2p-smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-account:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Scoped type checks
        run: pnpm --filter @rakazo/desktop check && pnpm --filter @rakazo/web check && pnpm --filter @rakazo/p2p-gateway check
      - name: Account proxy and gateway regression tests
        run: pnpm exec vitest run apps/desktop/src apps/p2p-gateway/src apps/web/src/lib/p2p-client.test.ts apps/web/src/lib/p2p-locales.test.ts apps/web/src/pages/Auth.test.tsx apps/web/src/pages/Pairing.test.tsx packages/p2p-prototype/src --maxWorkers=4
      - name: Check changed TypeScript
        run: pnpm exec biome check apps/web/src/lib/p2p-client.ts apps/web/src/lib/p2p-client.test.ts packages/p2p-prototype/src/node-agent.ts packages/p2p-prototype/src/node-auth.ts packages/p2p-prototype/src/node-auth.test.ts packages/p2p-prototype/src/channel-protocol.ts packages/p2p-prototype/src/node-channel-server.ts packages/p2p-prototype/src/data-channel-client.ts packages/p2p-prototype/src/client-transport.test.ts
      - name: Build isolated desktop agent
        run: node apps/desktop/scripts/build-p2p-agent.mjs
      - name: Build real web application
        env:
          VITE_P2P_GATEWAY_URL: https://p2p.vnbot.run
        run: pnpm --filter @rakazo/web build
      - name: App Worker dry run
        working-directory: apps/p2p-gateway
        run: pnpm exec wrangler deploy --config ../../deploy/cloudflare/app/wrangler.toml --dry-run --outdir ../../.out/app-worker --var AUTH_ORIGIN:https://accounts.example.test --var P2P_GATEWAY_URL:https://p2p.vnbot.run
      - uses: actions/upload-artifact@v4
        with:
          name: p2p-renewal-build-${{ matrix.os }}
          path: |
            .out/app-worker
            apps/web/dist
            apps/desktop/dist/p2p-agent.js
          retention-days: 7
