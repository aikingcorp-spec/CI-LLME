name: desktop-windows

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/p2p-prototype/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-and-smoke:
    name: Package, install and smoke test the Windows installers
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      # Installers are unsigned: never look for a signing identity.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RAKAZO_ALLOW_DEV_SECRETS: "1"
      SMOKE_DIR: ${{ github.workspace }}\smoke-artifacts
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Installing on Windows fetches the win32 prebuilds of node-datachannel and the
      # Windows Postgres binaries; do not cross-install from another OS.
      - run: pnpm install --frozen-lockfile
      - name: Generate the database client
        run: pnpm db:generate
      - name: Unit tests
        run: pnpm --filter @rakazo/desktop test
      - name: Package NSIS and MSI
        run: pnpm --filter @rakazo/desktop run pack:win
      - name: Silent install, smoke test, uninstall
        run: |
          New-Item -ItemType Directory -Force -Path $env:SMOKE_DIR | Out-Null
          $installer = (Get-ChildItem apps/desktop/out -Filter 'VNBot-Setup-*.exe' | Select-Object -First 1).FullName
          if (-not $installer) { throw 'NSIS installer was not produced' }
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\VNBot'
          $exe = Join-Path $installDir 'VNBot.exe'
          if (-not (Test-Path $exe)) { throw "VNBot.exe not found in $installDir" }

          # node-datachannel must load from the unpacked resources of the installed app.
          $env:NDC_PATH = Join-Path $installDir 'resources\app.asar.unpacked\node_modules\node-datachannel'
          $env:ELECTRON_RUN_AS_NODE = '1'
          & $exe -e "require(process.env.NDC_PATH); console.log('node-datachannel loaded')"
          if ($LASTEXITCODE -ne 0) { throw 'node-datachannel failed to load from the installed app' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE

          # The app starts its own stack, writes the web URL under its user data directory,
          # and must answer /health within two minutes.
          $env:RAKAZO_DESKTOP_SMOKE = '1'
          $urlFile = Join-Path $env:APPDATA 'VNBot\stack\.desktop-web-url'
          $app = Start-Process -FilePath $exe -PassThru `
            -RedirectStandardOutput (Join-Path $env:SMOKE_DIR 'app.out.log') `
            -RedirectStandardError (Join-Path $env:SMOKE_DIR 'app.err.log')
          $healthy = $false
          try {
            $deadline = (Get-Date).AddSeconds(120)
            while ((Get-Date) -lt $deadline) {
              if (Test-Path $urlFile) {
                $url = (Get-Content $urlFile -Raw).Trim()
                if ($url) {
                  try {
                    $res = Invoke-WebRequest -Uri "$url/health" -UseBasicParsing -TimeoutSec 5
                    if ($res.StatusCode -eq 200) { Write-Host "health ok at $url"; $healthy = $true; break }
                  } catch { }
                }
              }
              if ($app.HasExited) { Write-Host 'app exited before /health answered'; break }
              Start-Sleep -Seconds 2
            }
          } finally {
            taskkill /F /T /PID $app.Id 2>&1 | Out-Null
            Get-Process -Name postgres -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          if (-not $healthy) { throw 'no 200 from /health within 120s' }

          # `_?=` keeps the uninstaller in place so Start-Process -Wait waits for it.
          $uninstaller = Join-Path $installDir 'Uninstall VNBot.exe'
          Start-Process -FilePath $uninstaller -ArgumentList '/S', "_?=$installDir" -Wait
          if (Test-Path $exe) { throw 'VNBot.exe still present after uninstall' }
      - name: Collect logs
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path "$env:SMOKE_DIR\userdata" | Out-Null
          # Only log files and the web URL marker: the database directory and keys stay on the runner.
          $root = Join-Path $env:APPDATA 'VNBot'
          if (Test-Path $root) {
            Get-ChildItem $root -Recurse -File -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -eq '.log' -or $_.Name -eq '.desktop-web-url' } |
              ForEach-Object {
                $dest = Join-Path "$env:SMOKE_DIR\userdata" $_.FullName.Substring($root.Length).TrimStart('\')
                New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
                Copy-Item $_.FullName $dest
              }
          }
      - name: Retain installers and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            apps/desktop/out/*.exe
            apps/desktop/out/*.msi
            smoke-artifacts/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
