# Install in CI-LLME as .github/workflows/release-desktop.yml on the Mac-only branch.
# No publication: artifacts remain candidates until the manual release gates pass.
name: macOS Universal 0.3.9 candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intel-rtc:
    if: github.repository == 'aikingcorp-spec/CI-LLME'
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: test "$(uname -m)" = x86_64
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm ci --prefix deploy/ci/mac-native-tools --ignore-scripts
      - name: Compile the pinned WebRTC addon natively for Intel
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          export CMAKE_PREFIX_PATH="$(brew --prefix openssl@3)"
          export rtc_source="$RUNNER_TEMP/rtc-intel-source"
          mkdir -p "$rtc_source"
          rsync -a --exclude=node_modules --exclude=build apps/desktop/node_modules/node-datachannel/ "$rtc_source/"
          ln -s "$GITHUB_WORKSPACE/deploy/ci/mac-native-tools/node_modules" "$rtc_source/node_modules"
          deploy/ci/mac-native-tools/node_modules/.bin/cmake-js compile --directory "$rtc_source" --arch x64 --CDCMAKE_POLICY_VERSION_MINIMUM=3.5 --CDCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          lipo -verify_arch x86_64 "$rtc_source/build/Release/node_datachannel.node"
          mkdir native-intel
          cp "$rtc_source/build/Release/node_datachannel.node" native-intel/
          otool -L native-intel/node_datachannel.node
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-intel-rtc
          path: native-intel/node_datachannel.node
          if-no-files-found: error
  build:
    needs: intel-rtc
    if: github.repository == 'aikingcorp-spec/CI-LLME'
    runs-on: macos-26
    timeout-minutes: 50
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # CI-LLME reuses a registered dispatch entry point. Test the unchanged SOURCE
      # release workflow, rather than this candidate-only CI dispatch wrapper.
      - run: cp .ci/release-desktop.source.yml .github/workflows/release-desktop.yml
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: test "$(uname -m)" = arm64
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @rakazo/desktop test
      - run: pnpm --filter @rakazo/web build && pnpm --filter @rakazo/desktop build:native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mac-intel-rtc
          path: native-intel
      - name: Create and verify a genuinely Universal WebRTC addon
        run: |
          rtc="apps/desktop/node_modules/node-datachannel/build/Release/node_datachannel.node"
          lipo -verify_arch arm64 "$rtc"
          lipo -create native-intel/node_datachannel.node "$rtc" -output "$RUNNER_TEMP/node_datachannel.node"
          lipo -verify_arch x86_64 arm64 "$RUNNER_TEMP/node_datachannel.node"
          cp "$RUNNER_TEMP/node_datachannel.node" "$rtc"
      - name: Build ad-hoc candidate only; do not publish an update feed
        run: pnpm --filter @rakazo/desktop exec electron-builder --mac --universal --publish never -c.mac.identity=- -c.mac.notarize=false
      - name: Inspect every Mach-O and required payload
        run: node apps/desktop/scripts/verify-mac-universal.mjs apps/desktop/out/mac-universal/VNBot.app > apps/desktop/out/native-inventory.json
      - name: Archive final app for testing the identical artifact on both CPUs
        run: |
          cd apps/desktop/out/mac-universal
          ditto -c -k --sequesterRsrc --keepParent VNBot.app ../universal-app.zip
      - name: Record provenance and checksums
        run: |
          cp .ci-source.json apps/desktop/out/source-provenance.json
          cd apps/desktop/out
          shasum -a 256 *.dmg *.zip > SHA256SUMS-mac.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-039-candidate
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.zip
            apps/desktop/out/*inventory.json
            apps/desktop/out/source-provenance.json
            apps/desktop/out/SHA256SUMS-mac.txt
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
  verify:
    needs: build
    if: github.repository == 'aikingcorp-spec/CI-LLME'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RAKAZO_ALLOW_DEV_SECRETS: '1'
      RAKAZO_DESKTOP_AUTO_UPDATE: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # CI-LLME reuses a registered dispatch entry point. Test the unchanged SOURCE
      # release workflow, rather than this candidate-only CI dispatch wrapper.
      - run: cp .ci/release-desktop.source.yml .github/workflows/release-desktop.yml
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: test "$(uname -m)" = '${{ matrix.arch }}'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-039-candidate
          path: candidate
      - run: ditto -x -k candidate/universal-app.zip candidate/app
      - run: pnpm install --frozen-lockfile && pnpm db:generate
      - name: Load addons with the final packaged Electron on the actual CPU
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: candidate/app/VNBot.app/Contents/MacOS/VNBot apps/desktop/scripts/smoke-mac-addons.cjs candidate/app/VNBot.app/Contents/Resources
      - name: Cold start and restart without Docker or external Node runtime
        run: |
          mkdir -p evidence
          export RAKAZO_PERFORMANCE_USER_DATA="$RUNNER_TEMP/mac-native-data"
          export RAKAZO_DESKTOP_SMOKE=1
          for pass in 1 2; do
            PATH="/usr/bin:/bin:/usr/sbin:/sbin" candidate/app/VNBot.app/Contents/MacOS/VNBot > "evidence/start-$pass.log" 2>&1
            grep -E '^RAKAZO_DESKTOP_SMOKE ok http://127.0.0.1:[0-9]+$' "evidence/start-$pass.log"
            test -f "$RAKAZO_PERFORMANCE_USER_DATA/pg/data/PG_VERSION"
            if pgrep -f 'candidate/app/VNBot.app.*native/bin/postgres'; then exit 1; fi
          done
      - name: OAuth popup security with the final app
        env:
          DESKTOP_POPUP_TEST_EXECUTABLE: ${{ github.workspace }}/candidate/app/VNBot.app/Contents/MacOS/VNBot
        run: pnpm --filter @rakazo/desktop exec playwright test --config e2e/playwright.config.ts oauth-popup.spec.ts
      - name: Real Chromium, Marketplace OAuth fixtures and isolated P2P RPC
        run: |
          pnpm --filter @rakazo/web exec playwright install chromium
          brew list libpq >/dev/null 2>&1 || brew install libpq
          export PATH="$(brew --prefix libpq)/bin:$PATH"
          node apps/desktop/scripts/build-p2p-agent.mjs
          pnpm exec tsx apps/desktop/scripts/smoke-mac-p2p.ts candidate/app/VNBot.app/Contents/Resources
      - name: Connector and OAuth regression tests
        run: pnpm exec vitest run packages/adapters/src/composio-connector.test.ts packages/adapters/src/composio-catalog-cache.test.ts packages/adapters/src/mcp-oauth.test.ts packages/adapters/src/mcp-transport.test.ts packages/adapters/src/plugin-connectors.test.ts apps/api/src/plugin-installs.test.ts apps/api/src/plugin-marketplace.test.ts --maxWorkers=2
      - name: Connectivity regression tests on macOS
        run: pnpm exec vitest run packages/p2p-prototype/src apps/web/src/lib/p2p-client.test.ts --maxWorkers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-039-verification-${{ matrix.arch }}
          path: |
            evidence/
            test-report/
            apps/desktop/test-results/
          if-no-files-found: warn
