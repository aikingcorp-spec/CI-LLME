name: desktop-release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package unsigned ${{ matrix.artifact }} installers
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            script: pack:win
          - os: ubuntu-latest
            artifact: linux
            script: pack:linux
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the database client for desktop compilation
        run: pnpm db:generate
      - name: Package ${{ matrix.artifact }} installers
        run: pnpm --filter @rakazo/desktop run ${{ matrix.script }}
        env:
          # Installers are unsigned: never look for a signing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          RAKAZO_ALLOW_DEV_SECRETS: "1"
      - name: Retain installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: |
            apps/desktop/out/*.exe
            apps/desktop/out/*.msi
            apps/desktop/out/*.AppImage
            apps/desktop/out/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
