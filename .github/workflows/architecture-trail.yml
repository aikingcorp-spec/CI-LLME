name: architecture-trail
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

concurrency:
  group: architecture-trail-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Architecture trail
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Synthetic trail cases
        run: node --test scripts/check-architecture-trail.test.mjs
      - name: This pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-architecture-trail.mjs
