name: installed-desktop-update-acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  installed-update:
    if: github.repository == 'aikingcorp-spec/CI-LLME'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download exact CI installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41570266389 --repo aikingcorp-spec/CI-LLME --name desktop-windows --dir packaged-artifacts
      - name: Install and exercise real in-app updater
        run: |
          $installer = (Get-ChildItem packaged-artifacts -Recurse -Filter 'VNBot-Setup-0.3.8-x64.exe' | Select-Object -First 1).FullName
          if (-not $installer) { throw 'Expected installer missing' }
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          $env:PROBE_INSTALLED_APP = Join-Path $env:LOCALAPPDATA 'Programs\VNBot\VNBot.exe'
          node .ci/installed-update-probe.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed updater acceptance failed' }
